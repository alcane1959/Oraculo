    function executarSorteio() {
        const display = document.getElementById('display');
        const preview = document.getElementById('previewContainer');
        let qtd = parseInt(document.getElementById('qtd').value);
        
        if (isNaN(qtd) || qtd <= 0) {
            alert("O Guru exige uma quantidade numérica válida!");
            return;
        }

        display.innerHTML = '';
        preview.style.display = 'none';
        numerosAtuais = [];
        gerarNomeEVisual();

        for (let i = 0; i < qtd; i++) {
            setTimeout(() => {
                const num = Math.floor(Math.random() * 100).toString().padStart(2, '0');
                numerosAtuais.push(num);
                let esfera = document.createElement('div');
                esfera.className = 'number-sphere';
                esfera.innerText = num;
                display.appendChild(esfera);
                if(i === qtd - 1) finalizar();
            }, i * 35);
        }
    }
